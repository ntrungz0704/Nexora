<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="nxGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="nxGradDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0A5BFF" />
      <stop offset="100%" stop-color="#0038FF" />
    </linearGradient>
    <linearGradient id="nxGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="nxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0066FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#nxGlow)">
    <!-- Left vertical stem -->
    <path d="M12 50 L12 18 C12 15.8 13.8 14 16 14 C18.2 14 20 15.8 20 18 L20 46 C20 48.2 18.2 50 16 50 Z" fill="url(#nxGradLeft)" />
    
    <!-- Diagonal dynamic slash connecting left to right -->
    <path d="M15 17 L48 47 C49.6 48.4 52 47.3 52 45.2 L52 42 L20 14 C18.4 12.6 16 13.7 16 15.8 Z" fill="url(#nxGradDiag)" />
    
    <!-- Right vertical stem -->
    <path d="M44 46 L44 18 C44 15.8 45.8 14 48 14 C50.2 14 52 15.8 52 18 L52 46 C52 48.2 50.2 50 48 50 C45.8 50 44 48.2 44 46 Z" fill="url(#nxGradRight)" />
    
    <!-- Modern tech cyber accent line -->
    <circle cx="16" cy="16" r="2.5" fill="#FFFFFF" />
    <circle cx="48" cy="48" r="2.5" fill="#00F0FF" />
  </g>
</svg>
